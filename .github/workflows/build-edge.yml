name: Build — Edge Docker Images

on:
  push:
    branches: [main]
    paths:
      - "apps/edge/**"
      - ".github/workflows/build-edge.yml"
  workflow_dispatch:

concurrency:
  group: build-edge
  cancel-in-progress: false

env:
  REGISTRY: mosycrlmdev.azurecr.io

jobs:
  test:
    name: Test Edge Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/edge/requirements.base.txt
          pip install -r apps/edge/requirements.test.txt

      - name: Run tests
        run: |
          cd apps/edge
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: services

  build-base:
    name: Build Base Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push base services
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c 7)
          for SERVICE in fusion-service state-engine mqtt-bridge iot-agent; do
            echo "Building ${SERVICE}..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg SERVICE_SRC=${SERVICE} \
              --build-arg SERVICE_MODULE=$(echo ${SERVICE} | tr - _) \
              -f apps/edge/Dockerfile.base \
              -t ${REGISTRY}/mosy-${SERVICE}:${SHORT_SHA} \
              -t ${REGISTRY}/mosy-${SERVICE}:latest \
              --push \
              .
          done

  build-ai:
    name: Build AI Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push AI services
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c 7)
          for SERVICE in ocr-service vision-service safety-service; do
            echo "Building ${SERVICE}..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg SERVICE_SRC=${SERVICE} \
              --build-arg SERVICE_MODULE=$(echo ${SERVICE} | tr - _) \
              -f apps/edge/Dockerfile.ai \
              -t ${REGISTRY}/mosy-${SERVICE}:${SHORT_SHA} \
              -t ${REGISTRY}/mosy-${SERVICE}:latest \
              --push \
              .
          done
